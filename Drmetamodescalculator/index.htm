<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="téléchargement.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title> calculator</title>
</head>
<body bgcolor="gray">

    <center>
<div class="A1">
    <h1>MY Calculator</h1>
    <center>
    <div class="b">
    <input type="text" id="result" >
</div>
</center>
    <button onclick="result.value+=1">1</button>
    <button onclick="result.value+=2">2</button>
    <button  onclick="result.value+=3">3</button>
    <button  onclick="result.value+=0">0</button>
    <button class="c" onclick="result.value=result.value.toString().slice(0,-1)">C</button>
    <button onclick="result.value += ('.')" >.</button>
    <button onclick="result.value+=4" >4</button>
    <button onclick="result.value+=5">5</button>
    <button onclick="result.value+=6" >6</button>
    <button  onclick="result.value+= ('+')">+</button>
    <button onclick="result.value+=('-')" >-</button>
    <button  onclick="result.value+= ('*')">×</button>
    <button onclick="result.value+=7" >7</button>
    <button  onclick="result.value+=8">8</button>
    <button  onclick="result.value+=9">9</button>
    <button  onclick="result.value+=('/')">÷</button>
    
    <Button class="b0"  onclick="result.value= eval(result.value)">=</Button>
</div>
</center>
</body>
</html>
